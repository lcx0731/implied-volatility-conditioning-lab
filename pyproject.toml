[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "implied-volatility-conditioning-lab"
version = "0.1.0"
description = "Quote-aware implied volatility inversion with conditioning and boundary diagnostics"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "mpmath>=1.3,<2"]

[project.scripts]
iv-audit = "iv_audit.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
